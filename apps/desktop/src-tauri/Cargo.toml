[package]
name = "desktop-performance-panel"
version = "0.1.0"
description = "Windows floating performance monitor panel"
authors = []
edition = "2021"
rust-version = "1.78"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
